[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreplay"
version = "0.1.0"
description = "Time-travel debugger for AI agents: record a run, edit any step, replay from there. Local-first, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "agents", "llm", "debugging", "tracing", "replay"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentreplay = "agentreplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentreplay = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
